# Czas z Home Assistant
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - seconds: 0
        then:
          - script.execute: time_update

# Prosty interfejs - tylko zegar
lvgl:
  widgets:
    - label:
        id: clock_label
        align: CENTER
        text_font: montserrat_48
        text:
          time_format: "%H:%M"

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: clock_label
          text:
            time_format: "%H:%M"
