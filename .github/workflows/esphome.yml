name: ESPHome Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build ESPHome firmware
        uses: esphome/build-action@v1
        with:
          yaml_file: panel.yaml

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: |
            panel/.pioenvs/panel/firmware.bin
            panel/.pioenvs/panel/firmware.elf
